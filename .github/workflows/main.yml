
name: Build APK

on:
  workflow_dispatch:
    inputs:
      obfuscate:
        description: 'Acak dan kecilkan kode dengan ProGuard/R8'
        type: boolean
        default: false
        required: false
      release:
        description: 'Build release (memerlukan konfigurasi signing)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. CARI DAN EKSTRAK ZIP PROJECT
      # ==========================================
      - name: Cari dan ekstrak ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan di root repository"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          mkdir -p work
          unzip -q "$ZIP" -d work

          SG=$(find work -maxdepth 8 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n1)

          if [ -z "$SG" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            find work -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SG")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # ==========================================
      # 3. JAVA 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 4. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_SDK_ROOT="$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK tidak ditemukan"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "SDK berhasil disiapkan"
          ls "$ANDROID_HOME/platforms"

      # ==========================================
      # 5. GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # ==========================================
      # 6. PROGUARD / R8 OPSIONAL
      # ==========================================
      - name: Aktifkan ProGuard/R8
        if: ${{ inputs.obfuscate == true }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          import os
          import re
          import sys

          project = sys.argv[1]

          candidates = [
              os.path.join(project, "app", "build.gradle"),
              os.path.join(project, "app", "build.gradle.kts")
          ]

          path = next((p for p in candidates if os.path.isfile(p)), None)

          if not path:
              raise SystemExit("ERROR: app/build.gradle tidak ditemukan")

          kts = path.endswith(".kts")

          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          rules_path = os.path.join(project, "app", "proguard-rules.pro")

          rules = """
          -keepattributes *Annotation*
          -keep class * extends android.app.Activity
          -keep class * extends android.app.Service
          -keep class * extends android.content.BroadcastReceiver
          -keep class * extends android.content.ContentProvider
          -keep class **.BuildConfig { *; }
          """

          if not os.path.exists(rules_path):
              with open(rules_path, "w", encoding="utf-8") as f:
                  f.write(rules)

          match = re.search(r'buildTypes\s*\{', src)

          if not match:
              raise SystemExit("ERROR: blok buildTypes tidak ditemukan")

          if kts:
              addition = """
                  isMinifyEnabled = true
                  isShrinkResources = true
                  proguardFiles(
                      getDefaultProguardFile("proguard-android-optimize.txt"),
                      "proguard-rules.pro"
                  )
              """
          else:
              addition = """
                  minifyEnabled true
                  shrinkResources true
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              """

          debug = re.search(r'debug\s*\{([^}]*)\}', src)

          if debug:
              body = debug.group(1)

              if kts:
                  body = re.sub(r'isMinifyEnabled\s*=\s*false', '', body)
                  body = re.sub(r'isShrinkResources\s*=\s*false', '', body)
                  if "isMinifyEnabled" not in body:
                      body += addition
              else:
                  body = re.sub(r'minifyEnabled\s+false', '', body)
                  body = re.sub(r'shrinkResources\s+false', '', body)
                  if "minifyEnabled" not in body:
                      body += addition

              src = src[:debug.start(1)] + body + src[debug.end(1):]

          else:
              snippet = "\n        debug {" + addition + "\n        }\n"
              src = src[:match.end()] + snippet + src[match.end():]

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)

          print("R8 diaktifkan:", path)
          PY

      # ==========================================
      # 7. VALIDASI PROJECT
      # ==========================================
      - name: Validasi project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew tidak ditemukan"
            exit 1
          fi

          chmod +x gradlew

          echo "Project:"
          pwd

          echo "Gradle wrapper:"
          ls -l gradlew

          echo "Konfigurasi:"
          find . -maxdepth 2 -type f \
            \( -name build.gradle -o -name build.gradle.kts \)

      # ==========================================
      # 8. SIAPKAN LOG BUILD
      # ==========================================
      - name: Siapkan build log
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          touch "$GITHUB_WORKSPACE/build.log"
          echo "Build log siap"

      # ==========================================
      # 9. BUILD APK
      # ==========================================
      - name: Build APK
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/build.log"

          echo "==================================" | tee -a "$LOG"
          echo "SUGESTER APK BUILD" | tee -a "$LOG"
          echo "==================================" | tee -a "$LOG"

          if [ "${{ inputs.release }}" = "true" ]; then
            echo "Mode: RELEASE" | tee -a "$LOG"

            set +e
            ./gradlew assembleRelease \
              --stacktrace \
              --info \
              --console=plain 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
          else
            echo "Mode: DEBUG" | tee -a "$LOG"

            set +e
            ./gradlew assembleDebug \
              --stacktrace \
              --info \
              --console=plain 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            set -e
          fi

          if [ "$STATUS" -ne 0 ]; then
            echo "BUILD FAILED: $STATUS" | tee -a "$LOG"
            exit "$STATUS"
          fi

          echo "BUILD SUCCESS" | tee -a "$LOG"

      # ==========================================
      # 10. TAMPILKAN ERROR
      # ==========================================
      - name: Tampilkan ringkasan error
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"

          echo "===== BARIS PENYEBAB ERROR ====="

          if [ -f "$LOG" ]; then
            grep -niE \
              "AAPT|error:|ERROR|not found|What went wrong|Caused by|FAILURE:" \
              "$LOG" | tail -80 || true
          else
            echo "build.log belum tersedia"
          fi

      # ==========================================
      # 11. CARI HASIL APK
      # ==========================================
      - name: Cari hasil APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Folder APK tidak ditemukan"
            exit 1
          fi

          find "$APK_DIR" -type f -name '*.apk' -print

          APK=$(find "$APK_DIR" -type f -name '*.apk' | head -n1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak berhasil dibuat"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK ditemukan: $APK"

      # ==========================================
      # 12. UPLOAD APK KE GITHUB RELEASE
      # ==========================================
      - name: Upload APK ke Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="sugester-build-${{ github.run_number }}"

          if [ -z "${APK_PATH:-}" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          gh release create "$TAG" "$APK_PATH" \
            --title "Sugester $TAG" \
            --notes "Sugester Android APK build otomatis." \
            --repo "$GITHUB_REPOSITORY"

      # ==========================================
      # 13. UPLOAD APK ARTIFACT
      # ==========================================
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sugester-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 3

      # ==========================================
      # 14. UPLOAD LOG
      # ==========================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sugester-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3
          
